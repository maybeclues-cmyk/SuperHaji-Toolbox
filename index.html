<script>
const CAT_ICON = {烧伤:'Combustion',流血:'Laceration',震颤:'Vibration',破裂:'Burst',沉沦:'Sinking',呼吸法:'Breath',充能:'Charge',斩击:'Slash',突刺:'Pierce',打击:'Blunt',泛用:'none'};
const RARITIES = ['EX','V','IV','III','II','I'];
const S = {gifts:[],packs:[],recipes:[],user:{rarities:{},cats:{},labels:{},packMap:{}},sel:[],cat:'烧伤',q:'',page:'gifts',packOpen:null};
const icon = id => 'EgoGiftIcon/' + id + '.webp';
const catImg = c => CAT_ICON[c] ? 'Buf/' + CAT_ICON[c] + '.webp' : '';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
/* [状态] → 图标 + 中文名 */
function describe(text){
  if (!text) return '';
  const clean = String(text).replace(/<\/?noparse>/g, '').replace(/<style[^>]*>/g, '').replace(/<\/style>/g, '');
  return esc(clean).replace(/\[([A-Za-z0-9_]+)\]/g, (m, key) => {
    const cn = (S.status && S.status[key]) || key;
    return `<img class="status-icon" src="Buf/${encodeURIComponent(key)}.webp" onerror="this.style.display='none'"><span class="status-name">${esc(cn)}</span>`;
  });
}
const $ = id => document.getElementById(id);

/* 用户数据全部来自 data/user_data.json（仓库里那份）；页面不读也不写 localStorage。
   要改数据就改文件——这是唯一入口。 */
function loadUser(){
  const u = S.userData || {};
  S.user.rarities = u.giftRarities || {};
  S.user.cats = u.giftCategoryOverrides || {};
  S.user.labels = u.giftLabels || {};
  S.user.packMap = JSON.parse(JSON.stringify(u.giftCardPackMap || {}));
  /* 楼层规划选中的饰品：个人偏好，单独存，跟数据文件无关 */
  try {
    const v = JSON.parse(localStorage.getItem('may_plan_sel') || 'null');
    S.sel = Array.isArray(v) ? v.map(String) : [];
  } catch(e){ S.sel = []; }
}

/* 只存"勾了哪些饰品"，不碰任何数据 */
function savePlanSel(){
  try { localStorage.setItem('may_plan_sel', JSON.stringify(S.sel)); } catch(e){}
}
function saveUser(){ /* no-op：数据只从文件来 */ }
const giftById = id => S.gifts.find(g => String(g.id) === String(id));
const catOf = g => S.user.cats[g.id] || g.category || '泛用';
const rarOf = g => S.user.rarities[g.id] || g.rarity || '';
const packsOf = id => {
  /* 这个饰品「自己能拿到」的包 + 「用包里的材料合成出来」的包 */
  const out = [];
  const pushPid = pid => { const k = String(pid); if (!out.includes(k)) out.push(k); };

  const own = S.user.packMap[String(id)];
  (Array.isArray(own) ? own : (own ? [own] : [])).forEach(pushPid);

  /* 补：哪几个包里的饰品，能合成这个（含 pickAny） */
  for (const r of (S.recipes || [])) {
    if (String(r.resultId) !== String(id)) continue;
    const mats = (r.materialIds || []).map(String);
    const pool = (r.pickAny && (r.pickAny.from || []).length) ? r.pickAny.from.map(String) : [];
    const allMats = mats.concat(pool);
    for (const m of allMats) {
      const mv = S.user.packMap[m];
      (Array.isArray(mv) ? mv : (mv ? [mv] : [])).forEach(pushPid);
    }
  }

  return out.map(x => { const p = S.packs.find(pp => String(pp.id) === x || pp.name === x); return p ? p.name : x; });
};
function giftIdsInPack(packName){
  const p = S.packs.find(x => x.name === packName);
  if(!p) return [];
  const out = [];
  for (const [gid, val] of Object.entries(S.user.packMap)) {
    const arr = Array.isArray(val) ? val.map(String) : [String(val)];
    if (arr.includes(String(p.id))) out.push(gid);
  }
  return out;
}

const nrmName = s => String(s||'').replace(/\s+/g,'').replace(/・/g,'·');

/* 数据版本：改了 data/*.json 就把这个 +1 —— 浏览器才会去拉新的；没改就一直吃缓存。
   （这是手机上"每次打开都卡一会儿、第一下点不动"的根因：原来每个数据都 no-store，每次都重下） */
const DATA_VER = 'v45';
const PAGE_VER = '27a';   /* 改 index.html 或皮肤时手动 bump，徽章上看得见 */
const J = p => fetch(p + '?v=' + DATA_VER).then(x => x.json());

async function boot(){
  S.userData = await J('data/user_data.json').catch(()=>({}));
  loadUser();
  const [g,p,r,st,pe] = await Promise.all([
    J('data/egogift.json'),
    J('data/cardpacks_preset.json'),
    J('data/recipes_preset.json'),
    J('data/status_names.json').catch(()=>({})),
    J('data/pack_events.json').catch(()=>({}))
  ]);
  S.packEvents = pe || {};
  S.status = st || {};
  S.gifts=g.gifts||[];
  S.packs = (()=>{
    const user = Array.isArray(S.userData?.cardPacks) ? S.userData.cardPacks : [];
    const base = user.length ? user : (p || []);
    const have = new Set(base.map(x=>String(x.id)));
    const extra = (p || []).filter(x=>x && x.id && String(x.id).startsWith('pack_') && !have.has(String(x.id)));
    const all = base.concat(extra);
    /* 按 preset 的顺序排（她的旧卡包按名字对、新卡包按 id 对） */
    const ord = new Map(), ordName = new Map();
    (p || []).forEach((x, i) => { ord.set(String(x.id), i); ordName.set(x.name, i); });
    const rank = x => ord.has(String(x.id)) ? ord.get(String(x.id)) : (ordName.has(x.name) ? ordName.get(x.name) : 9999);
    all.sort((a,b) => rank(a) - rank(b));
    /* preset 里改过的名字（如汉化更新）盖过她 localStorage 里的旧名，但不动她的数据 */
    const presetById = new Map((p || []).map(x => [String(x.id), x]));
    return all.map((x,i) => {
      const pp = presetById.get(String(x.id));
      const o = (x.id === undefined || x.id === null) ? { ...x, id: 'preset_'+i } : { ...x };
      if (pp && pp.name) o.name = pp.name;
      return o;
    });
  })();
  /* 合成表：data/recipes_preset.json 是唯一来源（2026-11-25 已把浏览器里那份手改版整份收编进来） */
  S.recipes = Array.isArray(r) ? r : [];
  /* 卡包饰品：数据里写死的 gifts 合并进 packMap（localStorage 优先） */
  for(const pk of S.packs){
    if(!Array.isArray(pk.gifts)) continue;
    for(const gid of pk.gifts){
      const key = String(gid);
      const cur = S.user.packMap[key];
      const arr = Array.isArray(cur) ? cur.map(String) : (cur ? [String(cur)] : []);
      if(!arr.includes(String(pk.id))){ arr.push(String(pk.id)); S.user.packMap[key] = arr; }
    }
  }
  /* 权威映射：只当"这个卡包有没有饰品"的判据，不再往 packMap 里塞（旧版会写脏用户数据） */
  S.packSrc = await J('data/pack_sources.json').catch(()=>({}));
  /* 每个卡包实际挂了多少饰品（判"要不要显示"用真实数据，权威表只兜底） */
  S.packGiftCount = {};
  for (const g of S.gifts) {
    const key = String(g.id);
    const v = S.user.packMap[key];
    const arr = Array.isArray(v) ? v.map(String) : (v ? [String(v)] : []);
    for (const pid of arr) S.packGiftCount[pid] = (S.packGiftCount[pid] || 0) + 1;
  }
  /* 预加载音效：解码一次，之后点一下就响，不用等下载 */
  ['DI','DUANG','JIUZHE','QINHU','YEHEI','YILI'].forEach(loadSfx);

  S.ready = true;
  route();
}
/* ---------- 界面音效（DI=悬停，DUANG=点导航按钮） ---------- */
/* 音效走 Web Audio —— 和 <audio> 的 BGM 是两个通道，手机上能边放歌边出音效 */
let actx = null;
const SFXBUF = {};
function sfxCtx(){
  if(!actx){
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; }
  }
  if(actx.state === 'suspended') actx.resume().catch(()=>{});
  return actx;
}
const SFXAB = {};   // 先只把文件拉下来，decode 等第一次交互（不然 AudioContext 会被拦）
function loadSfx(name){
  if(SFXAB[name] !== undefined) return;
  SFXAB[name] = 'loading';
  fetch(name + '.mp3')
    .then(r => r.arrayBuffer())
    .then(ab => { SFXAB[name] = ab; })
    .catch(() => {});
}
/* 第一次点屏幕：把已下载的全解码，之后点一下就响 */
document.addEventListener('pointerdown', function initAudio(){
  const c = sfxCtx(); if(!c) return;
  for(const k in SFXAB){
    const ab = SFXAB[k];
    if(ab && ab !== 'loading' && SFXBUF[k] === undefined){
      c.decodeAudioData(ab.slice(0)).then(b => { SFXBUF[k] = b; }).catch(() => {});
    }
  }
}, { once: true, passive: true });
function playSfx(name){
  if(muted) return;
  const c = sfxCtx(); if(!c) return;

  const play = buf => {
    const src = c.createBufferSource();
    src.buffer = buf;
    const gain = c.createGain();
    gain.gain.value = (name === 'DUANG') ? 0.55 : 0.45;
    src.connect(gain); gain.connect(c.destination);
    try { src.start(); } catch(e) {}
  };

  const b = SFXBUF[name];
  if(b){ play(b); return; }

  const ab = SFXAB[name];
  if(ab && ab !== 'loading'){
    /* 文件已经有了，只是还没解码 —— 现在就解，解完立刻补播这一下 */
    SFXBUF[name] = null;              // 占位，别重复解码
    c.decodeAudioData(ab.slice(0)).then(buf => {
      SFXBUF[name] = buf;
      play(buf);                      // 这一下也补上
    }).catch(() => { SFXBUF[name] = undefined; });
    return;
  }
  if(ab === undefined) loadSfx(name); // 连文件都还没开始拉
}
function route(){
  const h = (location.hash.replace(/^#\/?/, '') || 'gifts');
  const page = ['gifts','packs','plan','recipes'].includes(h) ? h : 'gifts';
  if(page !== S.page) S.q = '';
  S.page = page;
  document.querySelectorAll('.nav-link').forEach(a => {
    a.classList.toggle('router-link-active', a.dataset.page === S.page);
  });
  if(!S.ready){            // 数据还没到：先给提示，别给一页空白（那就是"要点两下"的真相）
    const app = $('app');
    if(app) app.innerHTML = '<div style="padding:72px 20px;text-align:center;color:#7d8a9e;font-size:13px;letter-spacing:.12em">'
      + '<div style="width:26px;height:26px;margin:0 auto 16px;border:2px solid #1c2433;border-top-color:#c9a227;border-radius:50%;animation:ldspin .85s linear infinite"></div>'
      + '正在读取数据…</div><style>@keyframes ldspin{to{transform:rotate(360deg)}}</style>';
    return;
  }
  closeAll(); render();
}
window.addEventListener('hashchange', route);
/* 导航的点按立刻绑好——不等数据加载（否则第一次点只是一页空白，看着就像"要点两下"） */
function bindNav(){
  document.querySelectorAll('.nav-link').forEach(a => {
    a.onclick = ev => {
      ev.preventDefault();
      const page = a.dataset.page;
      const target = '#/' + page;
      /* 连点太快时，浏览器会把几次 hashchange 合并 / 延迟，route() 读到的还是旧的 hash。
         所以这里不依赖 hash：点击当场就把目标页渲染出来。 */
      if(location.hash !== target) location.hash = target;
      if(S.page !== page){ S.q = ''; S.page = page; }
      document.querySelectorAll('.nav-link').forEach(x => {
        x.classList.toggle('router-link-active', x.dataset.page === page);
      });
      if(S.ready){ closeAll(); render(); }
      try { playSfx('DUANG'); } catch(e) {}   // 音效不许挡住跳转
    };
  });
}

  const groups = {};
  for(const g of list){ const r=rarOf(g); (groups[r] ||= []).push(g); }
  const order = [...RARITIES.filter(r=>groups[r]), ...Object.keys(groups).filter(r=>!RARITIES.includes(r))];
  return order.map(r=>`<div class="rarity-section"><h3 class="rarity-section__title">${r?esc(r):'未标等级'}</h3>

function cardHtml(g){

let hoverTimer = null;
function hideHoverSoon(){ clearTimeout(hoverTimer); hoverTimer = setTimeout(()=>{ const p=$('hoverPanel'); if(p) p.classList.remove('open'); }, 160); }
function keepHover(){ clearTimeout(hoverTimer); }
function bindCards(root){
  root.querySelectorAll('.gift-card[data-id]').forEach(el=>{
    const id = el.dataset.id;
    el.onclick = () => {
      try { triggerGiftBgm(giftById(id)); } catch(e) {}

function showHover(id){
  const g = giftById(id); if(!g) return;

  const recs = S.recipes.filter(x=>String(x.resultId)===String(g.id));

  const entry = (gid,name) => `<span class="recipe-panel__entry"><img class="recipe-panel__gift-icon" src="${icon(gid)}" onerror="this.style.display='none'"><span class="recipe-panel__gift-name">${esc(name)}</span></span>`;
  const matHtml = mid => { const m=giftById(mid); return m ? entry(m.id,m.name) : `<span class="recipe-panel__gift-name">${esc(mid)}</span>`; };
  const pickHtml = rr => {
    const p = rr && rr.pickAny;
    if(!p || !Array.isArray(p.from) || !p.from.length) return '';
    const names = p.from.map(id=>{ const g=giftById(id); return g?esc(g.name):String(id); }).join(' / ');
    return `<span class="recipe-panel__pick">任选 ${p.count||1}：${names}</span>`;
  };
  const isRep = (S.user.labels[g.id]||'')==='复刻';

  $('modalBody').innerHTML = `
    <div class="modal-close" onclick="document.getElementById('modal').classList.remove('open')">×</div>
    <div class="modal-header">

      <div><div class="modal-name">${esc(g.name)}</div><div class="modal-category">${esc(cat)}${r?' · '+esc(r):''}</div></div>
      ${catImg(cat)?`<img class="modal-category-icon" src="${catImg(cat)}">`:''}
    </div>
    <div class="modal-controls">
      ${gradeBtns.length>1?`<div class="pill-group">${gradeBtns.map(([k,lbl])=>`<button class="pill-btn ${k===cur?'active':''}" data-grade="${k}">${lbl}</button>`).join('')}</div>`:''}
      <button class="plan-toggle ${S.sel.includes(String(g.id))?'in-plan':''}" id="planToggle">${S.sel.includes(String(g.id))?'− 从楼层规划移除':'+ 加入楼层规划'}</button>
    </div>
    ${d[cur]?`<div class="modal-description">${describe(d[cur])}</div>`:''}
    ${(()=>{ const rel=[...recs,...usedIn].filter((v,i,a)=>a.indexOf(v)===i); return rel.length?`<div class="recipe-panel__label">合成方式</div>${rel.map(rr=>{ const pick=pickHtml(rr); return `<div class="recipe-panel__list">${(rr.materialIds||[]).map(matHtml).join('<span class="recipe-panel__plus">+</span>')}${pick?`<span class="recipe-panel__plus">+</span>${pick}`:''}<span class="recipe-panel__plus">=</span>${(()=>{const res=giftById(rr.resultId);return res?entry(res.id,res.name):`<span class="recipe-panel__gift-name">${esc(rr.resultId)}</span>`})()}</div>`; }).join('')}`:'' })()}`;
  $('modal').classList.add('open');
  document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>openGift(id, b.dataset.grade));

function coverSrc(p){
  if (!p.imageKey) return '';
  let k = p.imageKey;
  // imageKey 存的是老版本的 png 名，实际文件都换成 webp 了
  k = k.replace(/\.(png|jpg|jpeg)$/i, '') + '.webp';
  return 'card_pack/' + encodeURIComponent(k);
}
function giftChip(g){
  if (!g) return '';
  return `<span class="pack-events__gift"><img src="${icon(g.id)}" loading="lazy" onerror="this.style.display='none'"><span>${esc(g.name)}</span></span>`;
}
function eventVisible(n){
  const kids = n.children || [];
  if (!kids.length) return (n.gifts || []).length > 0;
  return kids.some(eventVisible);
}
function eventTree(nodes, depth){
  const vis = (nodes || []).filter(eventVisible);
  if (!vis.length) return '';
  return `<ul class="pack-events__opts${depth?' pack-events__opts--sub':''}">${vis.map(n=>{
    const isLeaf = !(n.children && n.children.length);
    const gifts = isLeaf ? (n.gifts||[]).map(id=>giftChip(giftById(id))).join('') : '';
    return `<li class="pack-events__row">
      <span class="pack-events__opt">${esc(n.tab||'')}${n.title?' · '+esc(n.title):''}</span>
      ${gifts?`<span class="pack-events__arrow">→</span><span class="pack-events__gifts">${gifts}</span>`:''}
      ${(n.children&&n.children.length)?eventTree(n.children, depth+1):''}
    </li>`;
  }).join('')}</ul>`;
}
function packEventsFor(packName){
  const rows = (S.packEvents || {})[packName];
  if (!Array.isArray(rows) || !rows.length) return '';
  const byEv = new Map();
  for (const r of rows) {
    if (r.tree) { byEv.set(r.event, { tree: r.tree }); continue; }
    if (!byEv.has(r.event)) byEv.set(r.event, { opts: new Map() });
    const m = byEv.get(r.event).opts;
    const k = (r.tab || '') + '|' + (r.title || '');
    if (!m.has(k)) m.set(k, { tab: r.tab || '', title: r.title || '', gifts: [] });
    if (r.gift) m.get(k).gifts.push(r.gift);
  }
  return `<div class="pack-events">
    <div class="pack-events__label">事件</div>
    <div class="pack-events__src">数据来自灰机wiki</div>
    <ul class="pack-events__list">${[...byEv.entries()].map(([ev, v])=>{
      const body = v.tree ? eventTree(v.tree, 0) : `<ul class="pack-events__opts">${[...v.opts.values()].map(o=>`<li class="pack-events__row">
        <span class="pack-events__opt">${esc(o.tab)}${o.title?' · '+esc(o.title):''}</span>
        <span class="pack-events__arrow">→</span>
        <span class="pack-events__gifts">${o.gifts.map(giftChip).join('')}</span>
      </li>`).join('')}</ul>`;
      if (!body) return '';
      return `<li class="pack-events__ev">
      <div class="pack-events__evname">${esc(ev)}</div>
      ${body}
    </li>`;
    }).join('')}</ul>
  </div>`;
}
function packHtml(p){
  const cover = p.imageKey
    ? `<img data-cover loading="lazy" src="${coverSrc(p)}" onerror="this.style.display='none'"><div class="pack-item__cover-placeholder" style="display:none">${esc(p.name)}</div>`
    : `<img data-cover style="display:none"><div class="pack-item__cover-placeholder">${esc(p.name)}</div>`;
  const on = String(S.packOpen)===String(p.id) ? ' pack-item--active' : '';
  return `<div class="pack-item${on}" data-id="${esc(p.id)}" data-name="${esc(p.name)}"><div class="pack-item__cover">${cover}</div><div class="pack-item__name">${esc(p.name)}</div></div>`;
}
function packDetailHtml(p){
  const idsOf = g => { const v=S.user.packMap[String(g.id)]; return Array.isArray(v)?v.map(String):(v?[String(v)]:[]); };
  const G = S.gifts.filter(g=>idsOf(g).includes(String(p.id)));
  const inPack = new Set(G.map(g=>String(g.id)));
  /* 卡包里有材料 → 它合成出来的东西显示在右边（不管结果是不是本包的） */
  const synth = new Set(S.recipes.filter(r=>(r.materialIds||[]).some(m=>inPack.has(String(m)))).map(r=>String(r.resultId)));
  const isRep = g => (S.user.labels[g.id]||'')==='复刻';
  const V = G.filter(g=>!synth.has(String(g.id)) && !isRep(g));
  const outF = S.gifts.filter(g=>synth.has(String(g.id)) && !inPack.has(String(g.id)) && !isRep(g));
  const F = G.filter(g=>synth.has(String(g.id)) && !isRep(g)).concat(outF);
  const H = G.filter(isRep);
  const z = H.filter(g=>!synth.has(String(g.id)));
  const Y = H.filter(g=>synth.has(String(g.id)));
  const sep = '<div class="pack-detail__separator"></div>';
  const row = a => a.map(cardHtml).join('');
  return `<div class="pack-detail" id="packDetail">
    <div class="pack-detail__header"><h3 class="pack-detail__title">${esc(p.name)}</h3></div>
    <div class="pack-detail__gifts">${G.length===0?'<span class="pack-detail__empty">暂无饰品</span>':row(V)+(F.length?sep+row(F):'')}</div>
    ${H.length?`<div class="pack-detail__reprint"><span class="pack-detail__reprint-label">复刻</span><div class="pack-detail__gifts">${row(z)}${Y.length?sep+row(Y):''}</div></div>`:''}
    ${packEventsFor(p.name)}
  </div>`;
}

const FLOOR_ROWS = [
  {key:1,label:'第 1 层',floors:[1]},
  {key:2,label:'第 2 层',floors:[2]},
  {key:3,label:'第 3 层',floors:[3]},
  {key:4,label:'第 4 层',floors:[4]},
  {key:5,label:'第 5 层',floors:[5]},
  {key:6,label:'平行叠加',floors:[6,7,8,9,10]},
  {key:11,label:'极限模式',floors:[11,12,13,14,15]},
];
const PACK_COLORS = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#1abc9c','#3498db','#9b59b6','#e91e63','#00bcd4','#8bc34a','#ff9800','#795548','#607d8b','#cddc39','#ff5722'];
const packFloors = p => Array.isArray(p.floors) ? p.floors.slice() : [];
const packById = id => S.packs.find(p=>String(p.id)===String(id));
function packAvgFloor(p){ const f=packFloors(p); return f.length ? f.reduce((a,b)=>a+b,0)/f.length : -1; }
const packHasRow = (p,row) => packFloors(p).some(f=>row.floors.includes(f));
const cellStart = (p,i) => packHasRow(p,FLOOR_ROWS[i]) && !(i>0 && packHasRow(p,FLOOR_ROWS[i-1]));
function cellSpan(p,i){ let n=1; while(i+n<FLOOR_ROWS.length && packHasRow(p,FLOOR_ROWS[i+n])) n++; return n; }
function cellCovered(p,i){ for(let j=i-1;j>=0;j--){ if(cellStart(p,j)) return j + cellSpan(p,j) > i; } return false; }
function groups4(packId){
  const idsOf = g => { const v=S.user.packMap[String(g.id)]; return Array.isArray(v)?v.map(String):(v?[String(v)]:[]); };
  const G = S.gifts.filter(g=>idsOf(g).includes(String(packId)));
  const inPack = new Set(G.map(g=>String(g.id)));
  const synth = new Set(S.recipes.filter(r=>(r.materialIds||[]).some(m=>inPack.has(String(m)))).map(r=>String(r.resultId)));
  const isRep = g => (S.user.labels[g.id]||'')==='复刻';
  const outF = S.gifts.filter(g=>synth.has(String(g.id)) && !inPack.has(String(g.id)) && !isRep(g));
  return {
    G,
    V: G.filter(g=>!synth.has(String(g.id)) && !isRep(g)),
    F: G.filter(g=>synth.has(String(g.id)) && !isRep(g)).concat(outF),
    H: G.filter(isRep),
    z: G.filter(g=>isRep(g) && !synth.has(String(g.id))),
    Y: G.filter(g=>isRep(g) && synth.has(String(g.id))),
  };
}
function selectedPacks(){
  const set = new Set();
  for(const gid of S.sel){
    /* 用 packsOf：既算「包里直接有它」，也算「包里的材料能合成它」 */
    for(const name of packsOf(gid)){
      const pk = S.packs.find(x => x.name === name);
      if(pk) set.add(String(pk.id));
    }
  }
  return S.packs.filter(p=>set.has(String(p.id)));
}
function floorGridHtml(packs){
  const withF = packs.filter(p=>packFloors(p).length>0).slice().sort((a,b)=>packAvgFloor(a)-packAvgFloor(b));
  if(!withF.length) return '<div class="floor-detail__empty">还没有选中带楼层的卡包</div>';

  const col = i => PACK_COLORS[i % PACK_COLORS.length];
  const overview = floorCardsHtml(withF);
  let body = '';
  FLOOR_ROWS.forEach((row,i)=>{
    body += `<tr><td class="floor-table__row-label floor-table__sticky">${row.label}</td>`;
    withF.forEach((p,ci)=>{
      if(cellStart(p,i)){
        body += `<td rowspan="${cellSpan(p,i)}" class="floor-table__cell floor-table__cell--active" data-pack="${esc(p.id)}" style="background:${col(ci)}30;border-color:${col(ci)}"><span>${esc(p.name)}</span></td>`;
      } else if(!cellCovered(p,i)){
        body += `<td class="floor-table__cell"></td>`;
      }
    });
    body += '</tr>';
  });
  const head = `<tr><th class="floor-table__corner floor-table__sticky">层</th>${withF.map((_,ci)=>`<th class="floor-table__col-header"><span style="color:${col(ci)}">${ci+1}</span></th>`).join('')}</tr>`;
  return `${overview}<div class="floor-table-wrapper"><table class="floor-table"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}
/* 手机用的竖排楼层卡：一个包一块，下面写它在哪些层 */
function floorCardsHtml(packs){
  const col = i => PACK_COLORS[i % PACK_COLORS.length];
  const floorLabel = f => {
    const row = FLOOR_ROWS.find(r => r.floors.includes(f));
    return row ? row.label : ('第 ' + f + ' 层');
  };
  const cards = packs.map((p, i) => {
    const fl = packFloors(p).slice().sort((a,b)=>a-b);
    const labels = [...new Set(fl.map(floorLabel))];
    return `<div class="floor-card" data-pack="${esc(p.id)}" style="border-left-color:${col(i)}">
      ${p.imageKey?`<img class="floor-card__cover" src="${coverSrc(p)}" onerror="this.style.display='none'">`:''}
      <div class="floor-card__body">
        <div class="floor-card__name">${esc(p.name)}</div>
        <div class="floor-card__floors">${labels.map(l=>`<span class="floor-chip">${esc(l)}</span>`).join('')}</div>
      </div>
    </div>`;
  }).join('');
  return `<div class="floor-cards">${cards}</div>`;
}

function floorDetailHtml(){
  const id = S.planPick || S.planHover;
  const p = id ? packById(id) : null;
  if(!p) return '';
  const g = groups4(p.id);
  const sep = '<div class="floor-detail__separator"></div>';
  const row = a => a.map(cardHtml).join('');
  return `<div class="floor-detail"><h4 class="floor-detail__title">${esc(p.name)} 的饰品</h4>
    <div class="floor-detail__gifts">${g.G.length?row(g.V)+(g.F.length?sep+row(g.F):''):'<span class="floor-detail__empty">暂无饰品</span>'}</div>
    ${g.H.length?`<div class="floor-detail__reprint"><span class="floor-detail__reprint-label">复刻</span><div class="floor-detail__gifts">${row(g.z)}${g.Y.length?sep+row(g.Y):''}</div></div>`:''}
  </div>`;
}
function refreshFloorDetail(){
  const box = $('floorDetailBox');
  if(!box) return;
  box.innerHTML = floorDetailHtml();
  bindCards(box);
}
function renderPlan(){
  const sel = S.sel.map(giftById).filter(Boolean);
  const groups = [{key:'other',gifts:[]},{key:'low',gifts:[]},{key:'mid',gifts:[]},{key:'high',gifts:[]}];
  for(const g of sel){
    const pks = packsOf(g.id).map(n=>S.packs.find(x=>x.name===n)).filter(Boolean);
    const fl = pks.flatMap(packFloors);
    const avg = fl.length ? fl.reduce((a,b)=>a+b,0)/fl.length : -1;
    if(avg>=1 && avg<=3) groups[1].gifts.push(g);
    else if(avg>3 && avg<=10) groups[2].gifts.push(g);
    else if(avg>10 && avg<=15) groups[3].gifts.push(g);
    else groups[0].gifts.push(g);
  }
  const packs = selectedPacks();
  $('app').innerHTML = `<div class="planning-page">
    <div class="planning-page__section">
      <div class="section-header">
        <h3 class="section-title">已选中饰品（${sel.length}）</h3>
        <button class="plan-btn" id="planExport" title="把当前方案存成文件，发给别人">导出方案</button>
        <button class="plan-btn" id="planImport" title="读入别人分享的方案文件">导入方案</button>
        <input type="file" id="planFile" accept=".json,application/json" style="display:none">
        ${sel.length?`<button class="clear-all-btn" id="clearAll">清除全部</button>`:''}
      </div>
      ${(groups.filter(g=>g.gifts.length).map(gr=>`<div class="selected-group">${gr.gifts.map(g=>`<div class="selected-item" data-id="${g.id}">${cardHtml(g)}<button class="selected-item__remove" data-remove="${g.id}">×</button></div>`).join('')}</div>`).join('')) || '<div class="selected-list__empty">还没选饰品，去图鉴点卡片「加入规划」</div>'}
    </div>
    <div class="planning-page__section" id="floorSection">
      <h3 class="section-title">楼层分布</h3>
      ${floorGridHtml(packs)}
      <div id="floorDetailBox">${floorDetailHtml()}</div>
    </div>
  </div>`;
  bindCards($('app'));
  document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    S.sel = S.sel.filter(x=>x!==String(b.dataset.remove));
    savePlanSel(); renderPlan();
  });
  const ca=$('clearAll');
  if(ca) ca.onclick=()=>{ if(confirm('确定清除所有已选中饰品？')){ S.sel=[]; savePlanSel(); renderPlan(); } };

  /* 导出方案：{ version, name, gifts:[id...] } */
  const pe = $('planExport');
  if(pe) pe.onclick = () => {
    const data = { version: 1, name: 'E.G.O 楼层方案', gifts: S.sel.slice() };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], {type:'application/json'}));
    a.download = 'egogift-plan.json';
    document.body.appendChild(a); a.click(); a.remove();
  };
  /* 导入方案 */
  const pi = $('planImport'), pf = $('planFile');
  if(pi && pf){
    pi.onclick = () => pf.click();
    pf.onchange = () => {
      const f = pf.files && pf.files[0];
      if(!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const obj = JSON.parse(String(rd.result));
          const arr = Array.isArray(obj) ? obj : (obj.gifts || []);
          const ids = arr.map(x => String(typeof x === 'object' ? (x.id ?? x) : x)).filter(Boolean);
          const valid = ids.filter(id => giftById(id));
          if(!valid.length){ alert('这个文件里没有认识的饰品。'); return; }
          if(valid.length < ids.length){
            if(!confirm(`文件里 ${ids.length} 件，其中 ${ids.length - valid.length} 件在库里找不到，只导入认得的那 ${valid.length} 件？`)) return;
          }
          S.sel = [...new Set(valid)];
          savePlanSel(); renderPlan();
        } catch(e){ alert('读不懂这个文件。'); }
      };
      rd.readAsText(f);
      pf.value = '';
    };
  }
  document.querySelectorAll('[data-pack]').forEach(el=>{
    el.onmouseenter = () => { S.planHover = el.dataset.pack; refreshFloorDetail(); };
    el.onmouseleave = () => { S.planHover = null; refreshFloorDetail(); };
    el.onclick = ev => { ev.stopPropagation(); S.planPick = (String(S.planPick)===String(el.dataset.pack)) ? null : el.dataset.pack; refreshFloorDetail(); };
  });
}

/* ---------- 卡包封面（IndexedDB 里的用户图） ---------- */
function openImgDb(){
  return new Promise((res, rej) => {
    const req = indexedDB.open('egogift', 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('cardpack_images')) db.createObjectStore('cardpack_images');
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
function getCover(name){
  return new Promise(async (res) => {
    try{
      const db = await openImgDb();
      const tx = db.transaction('cardpack_images', 'readonly');
      const r = tx.objectStore('cardpack_images').get('cardpack_img_' + name);
      r.onsuccess = () => { db.close(); res(r.result || null); };
      r.onerror = () => { db.close(); res(null); };
    }catch(e){ res(null); }
  });
}
/* 封面已经随仓库发（card_pack/*.webp），src 在 packHtml 里就写好了。
   旧版这里要逐个去 IndexedDB 捞（77 次开关库、还是串行 await），手机上会卡成幻灯片 —— 现在是空操作。 */

/* ---------- BGM ---------- */
let audio=null, cur='', muted=false;
const BGM_VOL = 0.18;
S.playedBgm = new Set();
function sfx(name){ playSfx(name); }   // 统一走 Web Audio
function bgmEl(f){
  if(!audio){
    audio = new Audio();
    audio.loop = true;
    audio.volume = BGM_VOL;
    audio.addEventListener('play', syncBgmBtns);
    audio.addEventListener('pause', syncBgmBtns);
  }
  if(cur !== f){ audio.src = f; cur = f; }
  audio.volume = BGM_VOL;
  return audio;
}
function playBgm(f){ if(muted) return; S.playedBgm.add(f); syncBgmBtns(); bgmEl(f).play().catch(()=>{}); }
function toggleBgm(f){
  if(muted) return;                 // 总开关关着：点了也不响
  const a = bgmEl(f);
  if(cur === f && !a.paused) a.pause(); else a.play().catch(()=>{});
}
function syncBgmBtns(){
  $('bgmLei').classList.toggle('hidden', !S.playedBgm.has('BGM_LeiHeng.ogg'));
  $('bgmMat').classList.toggle('hidden', !S.playedBgm.has('BGM_Matthias.ogg'));
  $('bgmMao').classList.toggle('nav-btn--playing', !!(audio && cur==='BGM_Mao.ogg' && !audio.paused));
  $('bgmHa').classList.toggle('nav-btn--playing', !!(audio && cur==='BGM_Ha.ogg' && !audio.paused));
  $('bgmLian').classList.toggle('nav-btn--playing', !!(audio && cur==='BGM_Lian.ogg' && !audio.paused));
}
/* 点特定饰品才起的 BGM（原版规则：为了指挥官→QINHU→雷恒；复仇账簿：附录→YILI→马蒂亚斯） */
function triggerGiftBgm(g){
  if(!g) return;
  if(g.name === '为了指挥官'){
    sfx('QINHU');
    setTimeout(()=>{ if(!(audio && cur==='BGM_LeiHeng.ogg' && !audio.paused)) playBgm('BGM_LeiHeng.ogg'); }, 6000);
  }
  if(g.name === '复仇账簿：附录'){
    sfx('YILI');
    setTimeout(()=>{ if(!(audio && cur==='BGM_Matthias.ogg' && !audio.paused)) playBgm('BGM_Matthias.ogg'); }, 4000);
  }
}
$('bgmLei').onclick=()=>toggleBgm('BGM_LeiHeng.ogg');
$('bgmMat').onclick=()=>toggleBgm('BGM_Matthias.ogg');
$('bgmMao').onclick=()=>toggleBgm('BGM_Mao.ogg');
$('bgmHa').onclick=()=>toggleBgm('BGM_Ha.ogg');
$('bgmLian').onclick=()=>toggleBgm('BGM_Lian.ogg');
$('bgmMute').onclick=()=>{
  muted = !muted;
  $('bgmMute').classList.toggle('nav-btn--muted', muted);
  if(muted){
    // 关：停掉所有在响的东西，之后任何人再点播放都不出声
    if(audio) audio.pause();
    /* Web Audio 的短音效播完就没了，不用手动停 */
    syncBgmBtns();
  } else {
    // 开：只解除限制，不替她自动续播
    syncBgmBtns();
  }
};
