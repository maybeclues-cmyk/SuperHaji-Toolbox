<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>清理 凤・皇 卡包里的多余饰品</title>
<style>
  body{font-family:system-ui,sans-serif;background:#1a1410;color:#e8dcc8;padding:40px;margin:0;max-width:760px}
  h1{font-size:20px;margin:0 0 12px}
  p{color:#a9967e;font-size:14px;line-height:1.8}
  button{background:#c9a227;color:#1a1410;border:0;padding:12px 22px;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600;margin-top:14px}
  button:hover{background:#dbb63a}
  pre{background:#241c16;padding:14px;border-radius:8px;font-size:13px;line-height:1.6;white-space:pre-wrap}
  .ok{color:#7fbf7f}.warn{color:#e0a060}
</style>
</head>
<body>
<h1>清理「凤・皇」卡包里多的三个</h1>
<p>会从浏览器里 <code>egogift_giftCardPackMap</code> 删掉这四件挂在「凤・皇」上的关联，只留下 <b>9242 小凤玩偶</b>：</p>
<pre id="before">读取中…</pre>
<button onclick="clean()">清除多余的三个</button>
<pre id="after"></pre>
<script>
const PACK_ID = 'bd21476f-a066-49c3-9db0-0c2a1c6086df'; // 凤・皇
const KEEP = '9242';
const DROP = ['9081', '9082', '9083'];

function load(){ try { return JSON.parse(localStorage.getItem('egogift_giftCardPackMap') || '{}'); } catch(e){ return {}; } }

function show(el, obj){
  const list = [];
  for (const [gid, v] of Object.entries(obj)){
    const arr = Array.isArray(v) ? v : [v];
    if (arr.map(String).includes(PACK_ID)) list.push(gid);
  }
  el.textContent = '挂在「凤・皇」上的饰品：' + (list.length ? list.join(', ') : '（无）');
}

show(document.getElementById('before'), load());

function clean(){
  const map = load();
  let removed = 0;
  for (const gid of DROP){
    const v = map[gid];
    if (!v) continue;
    const arr = Array.isArray(v) ? v.map(String) : [String(v)];
    const next = arr.filter(x => x !== PACK_ID);
    if (next.length === arr.length) continue;
    removed++;
    if (next.length) map[gid] = next; else delete map[gid];
  }
  localStorage.setItem('egogift_giftCardPackMap', JSON.stringify(map));
  show(document.getElementById('after'), map);
  document.getElementById('after').textContent += '\n→ 删掉了 ' + removed + ' 条关联。刷新图鉴页面看结果。';
}
</script>
</body>
</html>
