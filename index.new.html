<style>
body{margin:0}
.gift-card{cursor:pointer}
.pack-item__cover{width:76px;height:98px}

.pack-item__name{font-size:11px;color:#c9b89a;max-width:88px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-overlay{display:none}.modal-overlay.open{display:flex}
.pack-modal-overlay{display:none}.pack-modal-overlay.open{display:flex}
.hidden{display:none!important}
.nav-btn--leiheng{color:#e74c3c}.nav-btn--matthias{color:#9b59b6}.nav-btn--mao{color:#7ec850;border-color:#4a7a30}.nav-btn--ha{color:#e6a817;border-color:#8b6914}.nav-btn--lian{color:#7aa7e6;border-color:#4a6a9a}.nav-btn--lian:hover{background:#4a6a9a4d}.nav-btn--ha:hover{background:#8b69144d}.nav-btn--mao:hover{background:#4a7a304d}.nav-btn--playing{background:#4a7a30;color:#fff;box-shadow:0 0 8px #7ec85080}
.context-menu{display:none}.context-menu.open{display:block}
.ctx-row{padding:6px 12px;display:flex;align-items:center;gap:8px;font-size:13px}
.ctx-row select,.ctx-row input{background:#2c1d12;color:#d4b896;border:1px solid #5a3a1a;border-radius:4px;padding:2px 4px;font-size:12px}
.ctx-item{padding:6px 12px;cursor:pointer;font-size:13px;color:#d4b896}

.recipe-panel{display:none}.recipe-panel.open{display:block}
.recipe-icon-wrapper{background:url(gift-bg.webp) center/contain no-repeat;border-radius:6px;padding:3px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}

.recipe-panel__title{color:#ffba00;font-size:16px;margin:0 0 10px}

.recipe-panel__gift-name{font-size:15px;color:#e8ddc9;margin-left:8px}
.recipe-panel__label{color:#ffba00;font-size:12px;margin:10px 0 4px}
.recipe-panel__desc{font-size:12px;color:#c9b89a;white-space:pre-wrap;background:#1d130d;border:1px solid #3c2a1a;border-radius:6px;padding:8px}
.recipe-panel__pack-item{font-size:12px;color:#c9b89a;padding:2px 0}
.recipe-panel__name{font-size:12px;color:#c9b89a}
.recipe-panel__close{position:absolute;right:10px;top:8px;cursor:pointer;color:#9a8b74;font-size:20px;background:none;border:none}

.nav-btn--mute:hover{background:#8b69144d}
.mute-icon{position:relative;display:inline-block}
.nav-btn--muted .mute-icon:after{content:"";position:absolute;left:-2px;top:-2px;width:120%;height:120%;background:linear-gradient(to top right,transparent 44%,#e6a817 44%,#e6a817 56%,transparent 56%);pointer-events:none}
.recipe-icon{width:56px;height:56px}
.recipe-icon-wrapper{width:56px;height:56px}
.recipe-gift-name{white-space:nowrap}
.recipe-note{font-size:11px;color:#c9a96a;margin-left:8px;white-space:nowrap;opacity:.85}
.pack-events{margin-top:16px;padding-top:12px;border-top:1px dashed #5a3a1a}
.pack-events__label{font-size:17px;color:#e8d3a9;margin:0 0 2px;letter-spacing:.5px}
.pack-events__src{font-size:11px;color:#8f7f6a;margin:0 0 10px}
.pack-events__pack{margin-bottom:16px}
.pack-events__pack-name{font-size:14px;color:#e0b96a;margin:0 0 6px;padding-left:8px;border-left:3px solid #8b6914}
.pack-events__list{list-style:none;margin:0;padding:0}
.pack-events__ev{padding:10px 0 2px}
.pack-events__evname{font-size:15px;color:#e8d3a9;font-weight:600;margin-bottom:4px;padding-left:9px;border-left:3px solid #8b6914}
.pack-events__opts{list-style:none;margin:0;padding:0 0 0 6px}
.pack-events__opts > li{position:relative;padding:3px 0 3px 18px}
.pack-events__opts > li::before{content:'';position:absolute;left:0;top:0;bottom:0;border-left:1px solid #4a3620}
.pack-events__opts > li:last-child::before{bottom:auto;height:17px}
.pack-events__opts > li::after{content:'';position:absolute;left:0;top:16px;width:13px;border-top:1px solid #4a3620}
.pack-events__row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:#c9b89a;border-radius:6px;padding:2px 6px 2px 2px}
.pack-events__row:hover{background:#2a1e14}
.pack-events__row > .pack-events__opts{flex-basis:100%;width:100%;margin-top:2px}
.pack-events__event{color:#e8d3a9}
.pack-events__opt{color:#9c8a72}
.pack-events__arrow{color:#6f5c44}
.pack-events__gifts{display:inline-flex;flex-wrap:wrap;gap:10px}
.pack-events__gift{display:inline-flex;align-items:center;gap:4px}
.pack-events__gift img{width:30px;height:30px;border-radius:4px}
.recipe-pick{display:inline-flex;align-items:center;gap:3px;border:1px dashed #6f5c44;border-radius:8px;padding:3px 7px;margin:0 4px}
.recipe-pick__icon{width:28px;height:28px;border-radius:4px;opacity:.95}
.recipe-pick__label{font-size:11px;color:#d8c39c;margin-left:5px;white-space:nowrap}
.recipe-panel{width:460px}
.recipe-panel__list{display:flex;flex-direction:row;align-items:center;flex-wrap:wrap;gap:4px;padding-bottom:2px}
.recipe-panel__entry{flex-wrap:nowrap}
.recipe-panel__gift-name{white-space:nowrap}
.recipe-panel__packs{display:flex;flex-wrap:wrap;gap:8px}
#hoverPanel{padding-top:38px}
#hoverPanel .recipe-panel__label{margin:8px 0 6px}

#hoverPanel .recipe-panel__pack-img{width:48px;height:48px}
.selected-item__remove{z-index:3;opacity:0;transition:opacity .15s;pointer-events:none}
.selected-item:hover .selected-item__remove{opacity:1;pointer-events:auto}
.selected-item .gift-card{pointer-events:auto}
.filter-btn__icon{width:14px;height:14px;vertical-align:-2px;margin-right:4px;border-radius:50%}
.filter-btn[data-cat="全部"]{margin-left:14px}
</style>

<body>
<div class="app">
  <nav class="nav-bar">
    <a class="nav-link" href="#/gifts" data-page="gifts"><img class="nav-icon" src="nav-icon-pack.webp" alt="">饰品图鉴</a>
    <a class="nav-link" href="#/packs" data-page="packs"><img class="nav-icon" src="nav-icon-gift.webp" alt="">卡包饰品</a>
    <a class="nav-link" href="#/plan" data-page="plan"><img class="nav-icon" src="nav-icon-floor.webp" alt="">楼层规划</a>
    <a class="nav-link" href="#/recipes" data-page="recipes"><img class="nav-icon" src="nav-icon-recipe.webp" alt="">合成方式</a>
    <button class="nav-btn nav-btn--mute" id="bgmMute" title="总开关"><span class="mute-icon">♪</span></button>
    <button class="nav-btn nav-btn--leiheng hidden" id="bgmLei" title="BGM：雷恒">雷</button>
    <button class="nav-btn nav-btn--matthias hidden" id="bgmMat" title="BGM：马蒂亚斯">马</button>
    <button class="nav-btn nav-btn--mao" id="bgmMao" title="BGM：哈基米起床">眠</button>
    <button class="nav-btn nav-btn--ha" id="bgmHa" title="BGM：最后一哈">末</button>
    <button class="nav-btn nav-btn--lian" id="bgmLian" title="BGM：蓝莲哈">莲</button>
  </nav>
  <main class="main-content" id="app"></main>
</div>

<div class="modal-overlay" id="modal"><div class="modal-content" id="modalBody"></div></div>
<div class="pack-modal-overlay" id="packModal"><div class="pack-detail" id="packBody"></div></div>
<div class="recipe-panel" id="hoverPanel"></div>
<div class="context-menu" id="ctxMenu"></div>

<script>
const CAT_ICON = {烧伤:'Combustion',流血:'Laceration',震颤:'Vibration',破裂:'Burst',沉沦:'Sinking',呼吸法:'Breath',充能:'Charge',斩击:'Slash',突刺:'Pierce',打击:'Blunt',泛用:'none'};
const RARITIES = ['EX','V','IV','III','II','I'];
const S = {gifts:[],packs:[],recipes:[],user:{rarities:{},cats:{},labels:{},packMap:{}},sel:[],cat:'烧伤',q:'',page:'gifts',packOpen:null};
const icon = id => 'EgoGiftIcon/' + id + '.webp';
const catImg = c => CAT_ICON[c] ? 'Buf/' + CAT_ICON[c] + '.webp' : '';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
/* [状态] → 图标 + 中文名 */
function describe(text){
  if (!text) return '';
  const clean = String(text).replace(/<\/?noparse>/g, '').replace(/<style[^>]*>/g, '').replace(/<\/style>/g, '');
  return esc(clean).replace(/\[([A-Za-z0-9_]+)\]/g, (m, key) => {
    const cn = (S.status && S.status[key]) || key;
    return `<img class="status-icon" src="Buf/${encodeURIComponent(key)}.webp" onerror="this.style.display='none'"><span class="status-name">${esc(cn)}</span>`;
  });
}
const $ = id => document.getElementById(id);

/* 用户数据全部来自 data/user_data.json（仓库里那份）；页面不读也不写 localStorage。
   要改数据就改文件——这是唯一入口。 */
function loadUser(){
  const u = S.userData || {};
  S.user.rarities = u.giftRarities || {};
  S.user.cats = u.giftCategoryOverrides || {};
  S.user.labels = u.giftLabels || {};
  S.user.packMap = JSON.parse(JSON.stringify(u.giftCardPackMap || {}));
  S.sel = [];   // 楼层规划选中是临时状态，不落地
}
function saveUser(){ /* no-op：数据只从文件来 */ }
const giftById = id => S.gifts.find(g => String(g.id) === String(id));
const catOf = g => S.user.cats[g.id] || g.category || '泛用';
const rarOf = g => S.user.rarities[g.id] || g.rarity || '';
const packsOf = id => {
  const v = S.user.packMap[String(id)];
  const arr = Array.isArray(v) ? v.map(String) : (v ? [String(v)] : []);
  return arr.map(x => { const p = S.packs.find(pp => String(pp.id) === x || pp.name === x); return p ? p.name : x; });
};
function giftIdsInPack(packName){
  const p = S.packs.find(x => x.name === packName);
  if(!p) return [];
  const out = [];
  for (const [gid, val] of Object.entries(S.user.packMap)) {
    const arr = Array.isArray(val) ? val.map(String) : [String(val)];
    if (arr.includes(String(p.id))) out.push(gid);
  }
  return out;
}

const nrmName = s => String(s||'').replace(/\s+/g,'').replace(/・/g,'·');

async function boot(){
  S.userData = await fetch('data/user_data.json',{cache:'no-store'}).then(x=>x.json()).catch(()=>({}));
  loadUser();
  const [g,p,r,st,pe] = await Promise.all([
    fetch('data/egogift.json',{cache:'no-store'}).then(x=>x.json()),
    fetch('data/cardpacks_preset.json',{cache:'no-store'}).then(x=>x.json()),
    fetch('data/recipes_preset.json',{cache:'no-store'}).then(x=>x.json()),
    fetch('data/status_names.json',{cache:'no-store'}).then(x=>x.json()).catch(()=>({})),
    fetch('data/pack_events.json',{cache:'no-store'}).then(x=>x.json()).catch(()=>({}))
  ]);
  S.packEvents = pe || {};
  S.status = st || {};
  S.gifts=g.gifts||[];
  S.packs = (()=>{
    const user = Array.isArray(S.userData?.cardPacks) ? S.userData.cardPacks : [];
    const base = user.length ? user : (p || []);
    const have = new Set(base.map(x=>String(x.id)));
    const extra = (p || []).filter(x=>x && x.id && String(x.id).startsWith('pack_') && !have.has(String(x.id)));
    const all = base.concat(extra);
    /* 按 preset 的顺序排（她的旧卡包按名字对、新卡包按 id 对） */
    const ord = new Map(), ordName = new Map();
    (p || []).forEach((x, i) => { ord.set(String(x.id), i); ordName.set(x.name, i); });
    const rank = x => ord.has(String(x.id)) ? ord.get(String(x.id)) : (ordName.has(x.name) ? ordName.get(x.name) : 9999);
    all.sort((a,b) => rank(a) - rank(b));
    /* preset 里改过的名字（如汉化更新）盖过她 localStorage 里的旧名，但不动她的数据 */
    const presetById = new Map((p || []).map(x => [String(x.id), x]));
    return all.map((x,i) => {
      const pp = presetById.get(String(x.id));
      const o = (x.id === undefined || x.id === null) ? { ...x, id: 'preset_'+i } : { ...x };
      if (pp && pp.name) o.name = pp.name;
      return o;
    });
  })();
  /* 合成表：data/recipes_preset.json 是唯一来源（2026-11-25 已把浏览器里那份手改版整份收编进来） */
  S.recipes = Array.isArray(r) ? r : [];
  /* 卡包饰品：数据里写死的 gifts 合并进 packMap（localStorage 优先） */
  for(const pk of S.packs){
    if(!Array.isArray(pk.gifts)) continue;
    for(const gid of pk.gifts){
      const key = String(gid);
      const cur = S.user.packMap[key];
      const arr = Array.isArray(cur) ? cur.map(String) : (cur ? [String(cur)] : []);
      if(!arr.includes(String(pk.id))){ arr.push(String(pk.id)); S.user.packMap[key] = arr; }
    }
  }
  /* 权威映射：只当"这个卡包有没有饰品"的判据，不再往 packMap 里塞（旧版会写脏用户数据） */
  S.packSrc = await fetch('data/pack_sources.json').then(x=>x.json()).catch(()=>({}));
  /* 每个卡包实际挂了多少饰品（判"要不要显示"用真实数据，权威表只兜底） */
  S.packGiftCount = {};
  for (const g of S.gifts) {
    const key = String(g.id);
    const v = S.user.packMap[key];
    const arr = Array.isArray(v) ? v.map(String) : (v ? [String(v)] : []);
    for (const pid of arr) S.packGiftCount[pid] = (S.packGiftCount[pid] || 0) + 1;
  }
  route();
}
/* ---------- 界面音效（DI=悬停，DUANG=点导航按钮） ---------- */
const SFX_HOVER = new Audio('DI.mp3');
const SFX_CLICK = new Audio('DUANG.mp3');
SFX_HOVER.volume = 0.45;
SFX_CLICK.volume = 0.55;
function playSfx(a){ try{ a.currentTime = 0; a.play().catch(()=>{}); }catch(e){} }
function route(){
  const h = (location.hash.replace(/^#\/?/, '') || 'gifts');
  const page = ['gifts','packs','plan','recipes'].includes(h) ? h : 'gifts';
  if(page !== S.page) S.q = '';
  S.page = page;
  document.querySelectorAll('.nav-link').forEach(a => {
    a.classList.toggle('router-link-active', a.dataset.page === S.page);
    a.onclick = () => playSfx(SFX_CLICK);
  });
  closeAll(); render();
}
window.addEventListener('hashchange', route);
function closeAll(){ $('modal').classList.remove('open'); $('packModal').classList.remove('open'); $('hoverPanel').classList.remove('open'); $('ctxMenu').classList.remove('open'); }

function render(){
  if(S.page==='gifts') renderGifts();
  else if(S.page==='packs') renderPacks();
  else if(S.page==='recipes') renderRecipes();
  else renderPlan();
}

/* ---------- 图鉴 ---------- */
function giftListHtml(){
  const q = S.q.trim().toLowerCase();
  const list = S.gifts.filter(g => q ? (g.name||'').toLowerCase().includes(q) : (S.cat==='全部'||catOf(g)===S.cat));
  const groups = {};
  for(const g of list){ const r=rarOf(g); (groups[r] ||= []).push(g); }
  const order = [...RARITIES.filter(r=>groups[r]), ...Object.keys(groups).filter(r=>!RARITIES.includes(r))];
  return order.map(r=>`<div class="rarity-section"><h3 class="rarity-section__title">${r?esc(r):'未标等级'}</h3>
        <div class="gift-grid">${groups[r].map(cardHtml).join('')}</div></div>`).join('');
}
function renderGiftList(){
  const gs = $('gs');
  if(!gs) return;
  gs.innerHTML = giftListHtml();
  bindCards(gs);
}
function renderGifts(){
  const ORDER = ['烧伤','流血','震颤','破裂','沉沦','呼吸法','充能','斩击','突刺','打击','泛用','全部'];
  const present = [...new Set(S.gifts.map(catOf))];
  const cats = [...ORDER.filter(c=>c==='全部'||present.includes(c)), ...present.filter(c=>!ORDER.includes(c))];
  $('app').innerHTML = `
  <div class="compendium">
    <div class="filter-bar">${cats.map(c=>`<button class="filter-btn ${c===S.cat?'active':''}" data-cat="${esc(c)}">${catImg(c)?`<img class="filter-btn__icon" src="${catImg(c)}" onerror="this.style.display='none'">`:''}${esc(c)}</button>`).join('')}</div>
    <input class="search-input" id="q" type="search" placeholder="搜索饰品名…" value="${esc(S.q)}">
    <div class="gift-sections" id="gs"></div>
  </div>`;
  document.querySelectorAll('[data-cat]').forEach(el=>el.onclick=()=>{S.cat=el.dataset.cat;renderGifts();});
  const qi=$('q');
  qi.oninput=e=>{ S.q=e.target.value; renderGiftList(); };
  renderGiftList();
}
function cardHtml(g){
  const r=rarOf(g);
  return `<div class="gift-card gift-card--normal" data-id="${g.id}" title="${esc(g.name)}">
    ${r?`<span class="gift-card__rarity">${esc(r)}</span>`:''}
    <img class="gift-card__icon" loading="lazy" src="${icon(g.id)}" onerror="this.classList.add('hidden')">
    ${catOf(g)!=='泛用'&&catImg(catOf(g))?`<img class="gift-card__category" src="${catImg(catOf(g))}">`:''}
  </div>`;
}
let hoverTimer = null;
function hideHoverSoon(){ clearTimeout(hoverTimer); hoverTimer = setTimeout(()=>{ const p=$('hoverPanel'); if(p) p.classList.remove('open'); }, 160); }
function keepHover(){ clearTimeout(hoverTimer); }
function bindCards(root){
  root.querySelectorAll('.gift-card[data-id]').forEach(el=>{
    const id = el.dataset.id;
    el.onclick = () => { triggerGiftBgm(giftById(id)); openGift(id); };
    el.oncontextmenu = ev => { ev.preventDefault(); openCtx(id, ev.clientX, ev.clientY); };
    el.onmouseenter = () => { playSfx(SFX_HOVER); keepHover(); showHover(id); };
    el.onmouseleave = () => hideHoverSoon();
  });
  const panel = $('hoverPanel');
  if(panel && !panel.dataset.hoverBound){
    panel.dataset.hoverBound = '1';
    panel.onmouseenter = keepHover;
    panel.onmouseleave = hideHoverSoon;
  }
}

/* ---------- 悬浮窗 ---------- */
function showHover(id){
  const g = giftById(id); if(!g) return;
  const recs = S.recipes.filter(x => String(x.resultId)===String(g.id));
  const usedIn = S.recipes.filter(x => (x.materialIds||[]).some(m=>String(m)===String(g.id)));
  const pk = packsOf(g.id);
  const entry = (gid,name) => `<span class="recipe-panel__entry"><img class="recipe-panel__gift-icon" src="${icon(gid)}" onerror="this.style.display='none'"><span class="recipe-panel__gift-name">${esc(name)}</span></span>`;
  const matHtml = mid => { const m=giftById(mid); return m ? entry(m.id,m.name) : `<span class="recipe-panel__gift-name">${esc(mid)}</span>`; };
  const isRep = (S.user.labels[g.id]||'')==='复刻';
  const panel = $('hoverPanel');
  if(!recs.length && !usedIn.length && !pk.length){ panel.classList.remove('open'); return; }
  panel.innerHTML = `
    <button class="recipe-panel__close" onclick="document.getElementById('hoverPanel').classList.remove('open')">×</button>
    ${(recs.length||usedIn.length)?`<div class="recipe-panel__label">合成方式</div>
    ${recs.map(rr=>`<div class="recipe-panel__list">${(rr.materialIds||[]).map(matHtml).join('<span class="recipe-panel__plus">+</span>')}</div>`).join('')}
    ${usedIn.map(rr=>{const res=giftById(rr.resultId);return `<div class="recipe-panel__list"><span class="recipe-panel__gift-name">可合成 </span>${res?entry(res.id,res.name):esc(rr.resultId)}</div>`}).join('')}`:''}
    ${pk.length?`<div class="recipe-panel__label">所属卡包</div><div class="recipe-panel__packs">${pk.map(n=>{const p=S.packs.find(x=>x.name===n);return `<div class="recipe-panel__pack-item">${p&&p.imageKey?`<img class="recipe-panel__pack-img" src="${coverSrc(p)}" onerror="this.style.display='none'">`:''}<span class="recipe-panel__pack-name">${esc(n)}${isRep?' 复刻':''}</span></div>`}).join('')}</div>`:''}`;
  panel.classList.add('open');
}

/* ---------- 详情弹窗 ---------- */
function openGift(id, grade){
  const g = giftById(id); if(!g) return;
  const cat = catOf(g), r = rarOf(g), pk = packsOf(g.id);
  const d = g.descriptions||{};
  const cur = (grade && d[grade]) ? grade : 'base';
  const recs = S.recipes.filter(x=>String(x.resultId)===String(g.id));
  const usedIn = S.recipes.filter(x=>(x.materialIds||[]).some(m=>String(m)===String(g.id)));

function renderPacks(){
  const q = S.q.trim().toLowerCase();
  const hasSrc = p => (S.packGiftCount && S.packGiftCount[String(p.id)] > 0)
    || !!(S.packSrc && (S.packSrc[nrmName(p.name)] || []).length);
  const list = S.packs.filter(hasSrc).filter(p=>!q||(p.name||'').toLowerCase().includes(q));
  const cur = S.packOpen ? S.packs.find(p=>String(p.id)===String(S.packOpen)) : null;
  $('app').innerHTML = `<div class="card-pack-page">
    <div class="search-wrapper"><input class="search-input" id="q" type="search" placeholder="搜索卡包名…" value="${esc(S.q)}"></div>

  const qi=$('q');
  qi.oninput=e=>{S.q=e.target.value;renderPacks();const n=$('q');n.focus();};

function coverSrc(p){
  if (!p.imageKey) return '';
  let k = p.imageKey;
  // imageKey 存的是老版本的 png 名，实际文件都换成 webp 了
  k = k.replace(/\.(png|jpg|jpeg)$/i, '') + '.webp';
  return 'card_pack/' + encodeURIComponent(k);
}
function giftChip(g){
  if (!g) return '';
  return `<span class="pack-events__gift"><img src="${icon(g.id)}" loading="lazy" onerror="this.style.display='none'"><span>${esc(g.name)}</span></span>`;
}
function eventVisible(n){
  const kids = n.children || [];
  if (!kids.length) return (n.gifts || []).length > 0;
  return kids.some(eventVisible);
}
function eventTree(nodes, depth){
  const vis = (nodes || []).filter(eventVisible);
  if (!vis.length) return '';
  return `<ul class="pack-events__opts${depth?' pack-events__opts--sub':''}">${vis.map(n=>{
    const isLeaf = !(n.children && n.children.length);
    const gifts = isLeaf ? (n.gifts||[]).map(id=>giftChip(giftById(id))).join('') : '';
    return `<li class="pack-events__row">
      <span class="pack-events__opt">${esc(n.tab||'')}${n.title?' · '+esc(n.title):''}</span>
      ${gifts?`<span class="pack-events__arrow">→</span><span class="pack-events__gifts">${gifts}</span>`:''}
      ${(n.children&&n.children.length)?eventTree(n.children, depth+1):''}
    </li>`;
  }).join('')}</ul>`;
}
function packEventsFor(packName){
  const rows = (S.packEvents || {})[packName];
  if (!Array.isArray(rows) || !rows.length) return '';
  const byEv = new Map();
  for (const r of rows) {
    if (r.tree) { byEv.set(r.event, { tree: r.tree }); continue; }
    if (!byEv.has(r.event)) byEv.set(r.event, { opts: new Map() });
    const m = byEv.get(r.event).opts;
    const k = (r.tab || '') + '|' + (r.title || '');
    if (!m.has(k)) m.set(k, { tab: r.tab || '', title: r.title || '', gifts: [] });
    if (r.gift) m.get(k).gifts.push(r.gift);
  }
  return `<div class="pack-events">
    <div class="pack-events__label">事件</div>
    <div class="pack-events__src">数据来自灰机wiki</div>
    <ul class="pack-events__list">${[...byEv.entries()].map(([ev, v])=>{
      const body = v.tree ? eventTree(v.tree, 0) : `<ul class="pack-events__opts">${[...v.opts.values()].map(o=>`<li class="pack-events__row">
        <span class="pack-events__opt">${esc(o.tab)}${o.title?' · '+esc(o.title):''}</span>
        <span class="pack-events__arrow">→</span>
        <span class="pack-events__gifts">${o.gifts.map(giftChip).join('')}</span>
      </li>`).join('')}</ul>`;
      if (!body) return '';
      return `<li class="pack-events__ev">
      <div class="pack-events__evname">${esc(ev)}</div>
      ${body}
    </li>`;
    }).join('')}</ul>
  </div>`;
}
function packHtml(p){
  const cover = p.imageKey
    ? `<img data-cover loading="lazy" src="${coverSrc(p)}" onerror="this.style.display='none'"><div class="pack-item__cover-placeholder" style="display:none">${esc(p.name)}</div>`
    : `<img data-cover style="display:none"><div class="pack-item__cover-placeholder">${esc(p.name)}</div>`;
  const on = String(S.packOpen)===String(p.id) ? ' pack-item--active' : '';
  return `<div class="pack-item${on}" data-id="${esc(p.id)}" data-name="${esc(p.name)}"><div class="pack-item__cover">${cover}</div><div class="pack-item__name">${esc(p.name)}</div></div>`;
}
function packDetailHtml(p){
  const idsOf = g => { const v=S.user.packMap[String(g.id)]; return Array.isArray(v)?v.map(String):(v?[String(v)]:[]); };
  const G = S.gifts.filter(g=>idsOf(g).includes(String(p.id)));
  const inPack = new Set(G.map(g=>String(g.id)));
  /* 卡包里有材料 → 它合成出来的东西显示在右边（不管结果是不是本包的） */
  const synth = new Set(S.recipes.filter(r=>(r.materialIds||[]).some(m=>inPack.has(String(m)))).map(r=>String(r.resultId)));
  const isRep = g => (S.user.labels[g.id]||'')==='复刻';
  const V = G.filter(g=>!synth.has(String(g.id)) && !isRep(g));
  const outF = S.gifts.filter(g=>synth.has(String(g.id)) && !inPack.has(String(g.id)) && !isRep(g));
  const F = G.filter(g=>synth.has(String(g.id)) && !isRep(g)).concat(outF);
  const H = G.filter(isRep);
  const z = H.filter(g=>!synth.has(String(g.id)));
  const Y = H.filter(g=>synth.has(String(g.id)));
  const sep = '<div class="pack-detail__separator"></div>';
  const row = a => a.map(cardHtml).join('');
  return `<div class="pack-detail" id="packDetail">
    <div class="pack-detail__header"><h3 class="pack-detail__title">${esc(p.name)}</h3></div>
    <div class="pack-detail__gifts">${G.length===0?'<span class="pack-detail__empty">暂无饰品</span>':row(V)+(F.length?sep+row(F):'')}</div>
    ${H.length?`<div class="pack-detail__reprint"><span class="pack-detail__reprint-label">复刻</span><div class="pack-detail__gifts">${row(z)}${Y.length?sep+row(Y):''}</div></div>`:''}
    ${packEventsFor(p.name)}
  </div>`;
}

/* ---------- 规划 ---------- */
const FLOOR_ROWS = [
  {key:1,label:'第 1 层',floors:[1]},
  {key:2,label:'第 2 层',floors:[2]},
  {key:3,label:'第 3 层',floors:[3]},
  {key:4,label:'第 4 层',floors:[4]},
  {key:5,label:'第 5 层',floors:[5]},
  {key:6,label:'平行叠加',floors:[6,7,8,9,10]},
  {key:11,label:'极限模式',floors:[11,12,13,14,15]},
];
const PACK_COLORS = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#1abc9c','#3498db','#9b59b6','#e91e63','#00bcd4','#8bc34a','#ff9800','#795548','#607d8b','#cddc39','#ff5722'];
const packFloors = p => Array.isArray(p.floors) ? p.floors.slice() : [];
const packById = id => S.packs.find(p=>String(p.id)===String(id));
function packAvgFloor(p){ const f=packFloors(p); return f.length ? f.reduce((a,b)=>a+b,0)/f.length : -1; }
const packHasRow = (p,row) => packFloors(p).some(f=>row.floors.includes(f));
const cellStart = (p,i) => packHasRow(p,FLOOR_ROWS[i]) && !(i>0 && packHasRow(p,FLOOR_ROWS[i-1]));
function cellSpan(p,i){ let n=1; while(i+n<FLOOR_ROWS.length && packHasRow(p,FLOOR_ROWS[i+n])) n++; return n; }
function cellCovered(p,i){ for(let j=i-1;j>=0;j--){ if(cellStart(p,j)) return j + cellSpan(p,j) > i; } return false; }
function groups4(packId){
  const idsOf = g => { const v=S.user.packMap[String(g.id)]; return Array.isArray(v)?v.map(String):(v?[String(v)]:[]); };
  const G = S.gifts.filter(g=>idsOf(g).includes(String(packId)));
  const inPack = new Set(G.map(g=>String(g.id)));
  const synth = new Set(S.recipes.filter(r=>(r.materialIds||[]).some(m=>inPack.has(String(m)))).map(r=>String(r.resultId)));
  const isRep = g => (S.user.labels[g.id]||'')==='复刻';
  const outF = S.gifts.filter(g=>synth.has(String(g.id)) && !inPack.has(String(g.id)) && !isRep(g));
  return {
    G,
    V: G.filter(g=>!synth.has(String(g.id)) && !isRep(g)),
    F: G.filter(g=>synth.has(String(g.id)) && !isRep(g)).concat(outF),
    H: G.filter(isRep),
    z: G.filter(g=>isRep(g) && !synth.has(String(g.id))),
    Y: G.filter(g=>isRep(g) && synth.has(String(g.id))),
  };
}
function selectedPacks(){
  const set = new Set();
  for(const gid of S.sel){
    const v = S.user.packMap[String(gid)];
    const arr = Array.isArray(v)?v:(v?[v]:[]);
    for(const x of arr) if(x) set.add(String(x));
  }
  return S.packs.filter(p=>set.has(String(p.id)));
}
function floorGridHtml(packs){
  const withF = packs.filter(p=>packFloors(p).length>0).slice().sort((a,b)=>packAvgFloor(a)-packAvgFloor(b));
  if(!withF.length) return '<div class="floor-detail__empty">还没有选中带楼层的卡包</div>';
  const col = i => PACK_COLORS[i % PACK_COLORS.length];
  const overview = `<div class="pack-overview">${withF.map((p,i)=>`<div class="pack-overview__item" data-pack="${esc(p.id)}" style="border-color:${col(i)}">${p.imageKey?`<img class="pack-overview__img" src="${coverSrc(p)}" onerror="this.style.display='none'">`:''}<span>${esc(p.name)}</span></div>`).join('')}</div>`;
  let body = '';
  FLOOR_ROWS.forEach((row,i)=>{
    body += `<tr><td class="floor-table__row-label floor-table__sticky">${row.label}</td>`;
    withF.forEach((p,ci)=>{
      if(cellStart(p,i)){
        body += `<td rowspan="${cellSpan(p,i)}" class="floor-table__cell floor-table__cell--active" data-pack="${esc(p.id)}" style="background:${col(ci)}30;border-color:${col(ci)}"><span>${esc(p.name)}</span></td>`;
      } else if(!cellCovered(p,i)){
        body += `<td class="floor-table__cell"></td>`;
      }
    });
    body += '</tr>';
  });
  const head = `<tr><th class="floor-table__corner floor-table__sticky">层</th>${withF.map((_,ci)=>`<th class="floor-table__col-header"><span style="color:${col(ci)}">${ci+1}</span></th>`).join('')}</tr>`;
  return `${overview}<div class="floor-table-wrapper"><table class="floor-table"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}
function floorDetailHtml(){
  const id = S.planPick || S.planHover;
  const p = id ? packById(id) : null;
  if(!p) return '';
  const g = groups4(p.id);
  const sep = '<div class="floor-detail__separator"></div>';
  const row = a => a.map(cardHtml).join('');
  return `<div class="floor-detail"><h4 class="floor-detail__title">${esc(p.name)} 的饰品</h4>
    <div class="floor-detail__gifts">${g.G.length?row(g.V)+(g.F.length?sep+row(g.F):''):'<span class="floor-detail__empty">暂无饰品</span>'}</div>
    ${g.H.length?`<div class="floor-detail__reprint"><span class="floor-detail__reprint-label">复刻</span><div class="floor-detail__gifts">${row(g.z)}${g.Y.length?sep+row(g.Y):''}</div></div>`:''}
  </div>`;
}
function refreshFloorDetail(){
  const box = $('floorDetailBox');
  if(!box) return;
  box.innerHTML = floorDetailHtml();
  bindCards(box);
}
function renderPlan(){
  const sel = S.sel.map(giftById).filter(Boolean);
  const groups = [{key:'other',gifts:[]},{key:'low',gifts:[]},{key:'mid',gifts:[]},{key:'high',gifts:[]}];
  for(const g of sel){
    const pks = packsOf(g.id).map(n=>S.packs.find(x=>x.name===n)).filter(Boolean);
    const fl = pks.flatMap(packFloors);
    const avg = fl.length ? fl.reduce((a,b)=>a+b,0)/fl.length : -1;
    if(avg>=1 && avg<=3) groups[1].gifts.push(g);
    else if(avg>3 && avg<=10) groups[2].gifts.push(g);
    else if(avg>10 && avg<=15) groups[3].gifts.push(g);
    else groups[0].gifts.push(g);
  }
  const packs = selectedPacks();
  $('app').innerHTML = `<div class="planning-page">
    <div class="planning-page__section">
      <div class="section-header">
        <h3 class="section-title">已选中饰品（${sel.length}）</h3>
        ${sel.length?`<button class="clear-all-btn" id="clearAll">清除全部</button>`:''}
      </div>
      ${(groups.filter(g=>g.gifts.length).map(gr=>`<div class="selected-group">${gr.gifts.map(g=>`<div class="selected-item" data-id="${g.id}">${cardHtml(g)}<button class="selected-item__remove" data-remove="${g.id}">×</button></div>`).join('')}</div>`).join('')) || '<div class="selected-list__empty">还没选饰品，去图鉴点卡片「加入规划」</div>'}
    </div>
    <div class="planning-page__section" id="floorSection">
      <h3 class="section-title">楼层分布</h3>
      ${floorGridHtml(packs)}
      <div id="floorDetailBox">${floorDetailHtml()}</div>
    </div>
  </div>`;
  bindCards($('app'));
  document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    S.sel = S.sel.filter(x=>x!==String(b.dataset.remove));
    saveUser(); renderPlan();
  });
  const ca=$('clearAll');
  if(ca) ca.onclick=()=>{ if(confirm('确定清除所有已选中饰品？')){ S.sel=[]; saveUser(); renderPlan(); } };
  document.querySelectorAll('[data-pack]').forEach(el=>{
    el.onmouseenter = () => { S.planHover = el.dataset.pack; refreshFloorDetail(); };
    el.onmouseleave = () => { S.planHover = null; refreshFloorDetail(); };
    el.onclick = ev => { ev.stopPropagation(); S.planPick = (String(S.planPick)===String(el.dataset.pack)) ? null : el.dataset.pack; refreshFloorDetail(); };
  });
}

/* ---------- 卡包封面（IndexedDB 里的用户图） ---------- */
function openImgDb(){
  return new Promise((res, rej) => {
    const req = indexedDB.open('egogift', 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('cardpack_images')) db.createObjectStore('cardpack_images');
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
function getCover(name){
  return new Promise(async (res) => {
    try{
      const db = await openImgDb();
      const tx = db.transaction('cardpack_images', 'readonly');
      const r = tx.objectStore('cardpack_images').get('cardpack_img_' + name);
      r.onsuccess = () => { db.close(); res(r.result || null); };
      r.onerror = () => { db.close(); res(null); };
    }catch(e){ res(null); }
  });
}
async function fillCovers(root){
  const items = [...root.querySelectorAll('.pack-item')];
  for (const el of items){
    const name = el.dataset.name;
    const img = el.querySelector('img[data-cover]');
    if (!img) continue;
    const data = await getCover(name);
    if (data){ img.src = data; img.style.display = 'block'; img.nextElementSibling && (img.nextElementSibling.style.display = 'none'); }
  }
}

/* ---------- BGM ---------- */
let audio=null, cur='', muted=false;
const BGM_VOL = 0.18;
const SFX = {};
S.playedBgm = new Set();
function sfx(name){
  if(muted) return;
  if(!SFX[name]){ SFX[name]=new Audio(name+'.mp3'); SFX[name].volume=1; }
  SFX[name].currentTime=0;
  SFX[name].play().catch(()=>{});
}
function bgmEl(f){
  if(!audio){
    audio = new Audio();
    audio.loop = true;
    audio.volume = BGM_VOL;
    audio.addEventListener('play', syncBgmBtns);
    audio.addEventListener('pause', syncBgmBtns);
  }
  if(cur !== f){ audio.src = f; cur = f; }
  audio.volume = BGM_VOL;
  return audio;
}
function playBgm(f){ if(muted) return; S.playedBgm.add(f); syncBgmBtns(); bgmEl(f).play().catch(()=>{}); }
function toggleBgm(f){
  if(muted) return;                 // 总开关关着：点了也不响
  const a = bgmEl(f);
  if(cur === f && !a.paused) a.pause(); else a.play().catch(()=>{});
}
function syncBgmBtns(){
  $('bgmLei').classList.toggle('hidden', !S.playedBgm.has('BGM_LeiHeng.ogg'));
  $('bgmMat').classList.toggle('hidden', !S.playedBgm.has('BGM_Matthias.ogg'));
  $('bgmMao').classList.toggle('nav-btn--playing', !!(audio && cur==='BGM_Mao.ogg' && !audio.paused));
  $('bgmHa').classList.toggle('nav-btn--playing', !!(audio && cur==='BGM_Ha.ogg' && !audio.paused));
  $('bgmLian').classList.toggle('nav-btn--playing', !!(audio && cur==='BGM_Lian.ogg' && !audio.paused));
}
/* 点特定饰品才起的 BGM（原版规则：为了指挥官→QINHU→雷恒；复仇账簿：附录→YILI→马蒂亚斯） */
function triggerGiftBgm(g){
  if(!g) return;
  if(g.name === '为了指挥官'){
    sfx('QINHU');
    setTimeout(()=>{ if(!(audio && cur==='BGM_LeiHeng.ogg' && !audio.paused)) playBgm('BGM_LeiHeng.ogg'); }, 6000);
  }
  if(g.name === '复仇账簿：附录'){
    sfx('YILI');
    setTimeout(()=>{ if(!(audio && cur==='BGM_Matthias.ogg' && !audio.paused)) playBgm('BGM_Matthias.ogg'); }, 4000);
  }
}
$('bgmLei').onclick=()=>toggleBgm('BGM_LeiHeng.ogg');
$('bgmMat').onclick=()=>toggleBgm('BGM_Matthias.ogg');
$('bgmMao').onclick=()=>toggleBgm('BGM_Mao.ogg');
$('bgmHa').onclick=()=>toggleBgm('BGM_Ha.ogg');
$('bgmLian').onclick=()=>toggleBgm('BGM_Lian.ogg');
$('bgmMute').onclick=()=>{
  muted = !muted;
  $('bgmMute').classList.toggle('nav-btn--muted', muted);
  if(muted){
    // 关：停掉所有在响的东西，之后任何人再点播放都不出声
    if(audio) audio.pause();
    for(const k in SFX){ try{ SFX[k].pause(); SFX[k].currentTime=0; }catch(e){} }
    [SFX_HOVER, SFX_CLICK].forEach(a => { try{ a.pause(); a.currentTime=0; }catch(e){} });
    syncBgmBtns();
  } else {
    // 开：只解除限制，不替她自动续播
    syncBgmBtns();
  }
};
/* 点空白处关掉详情 */
document.addEventListener('click', e => {
  const m = $('modal');
  if(m && m.classList.contains('open') && e.target === m) m.classList.remove('open');
});

boot();
</script>
